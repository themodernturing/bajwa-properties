<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Bajwa Properties</title>
  <meta name="description" content="Bajwa Properties se rabta karein - phone, WhatsApp, email ya office visit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <section class="page-header">
    <div class="container">
      <h1>Humse Rabta Karein</h1>
      <p><a href="index.html">Home</a> / Contact</p>
    </div>
  </section>

  <section class="section section-soft">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-info">
          <div class="info-card reveal"><div class="service-icon">📍</div><div><h3>Office Address</h3><p>Office #12, Main Boulevard, DHA Phase 5, Lahore</p></div></div>
          <div class="info-card reveal"><div class="service-icon">📞</div><div><h3>Phone / WhatsApp</h3><p><a href="tel:03001234567">0300-1234567</a></p></div></div>
          <div class="info-card reveal"><div class="service-icon">✉️</div><div><h3>Email</h3><p><a href="mailto:info@bajwaproperties.com">info@bajwaproperties.com</a></p></div></div>
          <div class="info-card reveal"><div class="service-icon">🕘</div><div><h3>Office Timings</h3><p>Mon - Sat: 10:00 AM - 8:00 PM<br>Sunday: Band</p></div></div>
        </div>

        <form class="contact-form reveal" id="contact-form">
          <h2>Message Bhejein</h2>
          <div class="form-row">
            <div class="field"><label>Aapka Naam *</label><input type="text" name="name" required placeholder="Full name"></div>
            <div class="field"><label>Phone Number *</label><input type="tel" name="phone" required placeholder="03XX-XXXXXXX"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Email</label><input type="email" name="email" placeholder="you@example.com"></div>
            <div class="field">
              <label>Aap Kya Chahte Hain?</label>
              <select name="interest">
                <option>Property Khareedna</option>
                <option>Property Bechna</option>
                <option>Rent Par Lena</option>
                <option>Rent Par Dena</option>
                <option>Investment Advice</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Message *</label><textarea name="message" rows="5" required placeholder="Apni zaroorat ke baare mein batayein..."></textarea></div>
          <button type="submit" class="btn btn-accent">Message Bhejein →</button>
          <div class="form-msg" id="form-msg"></div>
        </form>
      </div>

      <div class="map reveal">
        <a class="btn btn-primary" style="margin:20px" href="https://www.google.com/maps?q=DHA+Phase+5+Lahore" target="_blank" rel="noopener">📍 Google Maps Par Location Dekhein</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
